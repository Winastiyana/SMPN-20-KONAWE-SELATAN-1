<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMP Negeri 20 Konawe Selatan</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: #0c9463;
      color: white;
      padding: 10px 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      flex-wrap: wrap;
    }
    .counter-section {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin: 40px auto;
  background-color: #fff;
  padding: 30px;
  border-radius: 12px;
  max-width: 800px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
}
.counter-box {
  text-align: center;
}
.counter-box i {
  font-size: 40px;
  color: #0d6efd;
}
.counter-box span {
  display: block;
  font-size: 30px;
  font-weight: bold;
  margin-top: 10px;
  color: #2c3e50;
}
    .logo {
      font-weight: bold;
      font-size: 18px;
    }

    .sosmed-icons {
      display: flex;
      gap: 10px;
    }

    .sosmed-icons a {
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .nav-menu {
      margin-top: 10px;
      width: 100%;
      text-align: center;
    }

    .nav-menu a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .hero {
      padding-top: 120px;
      text-align: center;
      background: linear-gradient(to top, #f2f2f2, #d9edf7);
      padding-bottom: 40px;
    }
   .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    }

    .logo-img {
      height: 40px; /* Ubah sesuai ukuran yang diinginkan */
    }  

   .logo-text {
     font-weight: bold;
    font-size: 18px;
    color: white;
    }

    .hero img {
      width: 100%;
      max-width: 800px;
    }

    .slider {
      display: flex;
      overflow: hidden;
      max-width: 1000px;
      margin: 30px auto;
      position: relative;
    }

    .slides {
      display: flex;
      width: 300%;
      animation: slide 12s infinite;
    }

    .slides img {
      width: 100%;
      flex: 1 0 100%;
    }

    @keyframes slide {
      0% { transform: translateX(0); }
      33% { transform: translateX(-100%); }
      66% { transform: translateX(-200%); }
      100% { transform: translateX(0); }
    }

    .counter-section {
      display: flex;
      justify-content: space-around;
      align-items: center;
      background-color: #eee;
      padding: 20px;
      flex-wrap: wrap;
    }

    .counter-section div {
      text-align: center;
      margin: 10px;
    }

    .counter-section i {
      font-size: 30px;
      color: #0c9463;
    }

    .contact-form {
      padding: 40px 20px;
      background: #f9f9f9;
      max-width: 600px;
      margin: 0 auto;
    }

    .contact-form h3 {
      text-align: center;
      color: #0c9463;
    }

    .contact-form form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .contact-form input,
    .contact-form textarea {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    .contact-form button {
      background-color: #0c9463;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
    }

    .contact-form button:hover {
      background-color: #08714d;
    }

    .map {
      margin: 40px auto;
      max-width: 800px;
      text-align: center;
    }

    .map iframe {
      width: 100%;
      height: 400px;
      border: none;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .sosmed-icons {
        margin-top: 10px;
        margin-right: 20px; /* geser ke kiri */
      }
      .nav-menu {
        font-size: 1px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="image/Logo.jpg" alt="Logo SMA" class="logo-img">
      <span class="logo-text">SMP Negeri 20 Konawe Selatan</span>
    </div>
    <div class="sosmed-icons">
  <a href="https://www.facebook.com/namapengguna" target="_blank"><i class="fab fa-facebook"></i></a>
  <a href="https://www.instagram.com/namapengguna" target="_blank"><i class="fab fa-instagram"></i></a>
  <a href="https://youtube.com/@smpn20konsel?si=7IowiIrFtOMK7kyO" target="_blank"><i class="fab fa-youtube"></i></a>
  <a href="https://twitter.com/namapengguna" target="_blank"><i class="fab fa-twitter"></i></a>
</div>

    <div class="nav-menu">
      <a href="index.html">Home</a>
      <a href="profil.html">Profil</a>
    <a href="kesiswaan.html">Kesiswaan</a>
    <a href="informasi.html">Informasi</a>
    <a href="galeri.html">Galeri</a>
    <a href="kontak.html">Kontak</a>
    <a href="daftar_spmb.html">Daftar SPMB</a>
    </div>
  </div>

  <div class="hero">
    <h2>SMP Negeri 20 Konawe Selatan</h2>
  </div>

  <div class="slider">
    <div class="slides">
      <img src="image/SEKOLAH (2).jpg" alt="Slide 1">
      <img src="image/SEKOLAH.jpg" alt="Slide 2">
      <img src="image/upacara.jpg" alt="Slide 3">
    </div>
  </div>

  <div class="counter-section">
  <div class="counter-box">
    <i class="fas fa-user-graduate"></i>
    <p>Alumni</p>
    <span id="alumni-count">0</span>
  </div>
  <div class="counter-box">
    <i class="fas fa-users"></i>
    <p>Siswa</p>
    <span id="siswa-count">0</span>
  </div>
  <div class="counter-box">
    <i class="fas fa-chalkboard-teacher"></i>
    <p>Guru</p>
    <span id="guru-count">0</span>
  </div>
</div>

  <div class="map">
    <h3>Lokasi Kami</h3>
    <iframe src="https://www.google.com/maps/embed?pb=!1m10!1m8!1m3!1d966.5103690340791!2d122.272397!3d-4.0094382!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sid!4v1749658467121!5m2!1sen!2sid" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script>
  function animateCount(id, target) {
    const element = document.getElementById(id);
    let count = 0;
    const step = Math.ceil(target / 100);
    const interval = setInterval(() => {
      count += step;
      if (count >= target) {
        count = target;
        clearInterval(interval);
      }
      element.textContent = count;
    }, 20);
  }

  window.addEventListener('load', () => {
    animateCount('alumni-count', 3500);
    animateCount('siswa-count', 950);
    animateCount('guru-count', 55);
  });
</script>
</body>
</html>
